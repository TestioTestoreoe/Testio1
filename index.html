<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yapin Webhook Dispatcher</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --text-color: #f8fafc;
      --subtext-color: #94a3b8;
      --border-color: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin-top: 0;
      color: var(--accent-color);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--subtext-color);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .section-title {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* SAVE SLOTS PANEL */
    .slots-container {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .slots-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .slots-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .slot-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .slot-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .slot-add-btn {
      background: rgba(99, 102, 241, 0.2);
      border: 1px dashed var(--accent-color);
      color: #818cf8;
      width: 36px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .slot-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .slot-action-btn {
      flex: 1;
      padding: 6px;
      font-size: 0.8rem;
      margin-top: 0 !important;
      background: #334155;
    }

    .embed-section, .attachment-section {
      border: 1px dashed var(--border-color);
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      background: rgba(15, 23, 42, 0.4);
    }

    .flex-row {
      display: flex;
      gap: 12px;
    }

    .color-picker {
      height: 40px;
      padding: 2px;
      cursor: pointer;
    }

    button {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #4f46e5;
    }

    #status {
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: center;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }

    .status-success {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .status-error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🗣️ Yapin Webhook Sender</h2>

  <!-- SAVE SLOTS SYSTEM -->
  <div class="slots-container">
    <div class="slots-header">
      <span class="section-title" style="margin: 0;">💾 Profile Save Slots</span>
    </div>
    <div class="slots-grid" id="slotsGrid">
      <!-- Dynamically generated slots go here -->
    </div>
    <div class="slot-actions">
      <button class="slot-action-btn" onclick="saveCurrentSlot()">Save to Active Slot</button>
      <button class="slot-action-btn" onclick="clearCurrentSlot()" style="background: rgba(239,68,68,0.2); color: #f87171;">Clear Slot</button>
    </div>
  </div>
  
  <div class="form-group">
    <label for="webhookUrl">Webhook URL *</label>
    <input type="url" id="webhookUrl" placeholder="https://yapin.gg/api/webhooks/..." required />
  </div>

  <div class="form-group">
    <label for="username">Bot Display Name</label>
    <input type="text" id="username" placeholder="Yapin Bot" />
  </div>

  <div class="form-group">
    <label for="avatarUrl">Avatar Image URL</label>
    <input type="url" id="avatarUrl" placeholder="https://example.com/avatar.png" />
  </div>

  <div class="form-group">
    <label for="content">Main Message Content</label>
    <textarea id="content" placeholder="Type your message here..."></textarea>
  </div>

  <!-- ATTACHMENTS & IMAGE URL SECTION -->
  <div class="attachment-section">
    <div class="section-title">🖼️ Message Attachments & Image Links</div>

    <div class="form-group">
      <label for="fileInput">Upload Local File / Image (Attachment)</label>
      <input type="file" id="fileInput" />
    </div>

    <div class="form-group">
      <label for="messageImageUrl">Message Image URL (Direct Link)</label>
      <input type="url" id="messageImageUrl" placeholder="https://example.com/image.png" />
    </div>
  </div>

  <!-- EMBED BUILDER SECTION -->
  <div class="embed-section">
    <div class="section-title">✨ Rich Embed Card</div>
    
    <div class="flex-row">
      <div class="form-group" style="flex: 1;">
        <label for="embedTitle">Embed Title</label>
        <input type="text" id="embedTitle" placeholder="Announcement" />
      </div>
      <div class="form-group" style="width: 80px;">
        <label for="embedColor">Color</label>
        <input type="color" id="embedColor" class="color-picker" value="#6366f1" />
      </div>
    </div>

    <div class="form-group">
      <label for="embedDesc">Embed Description</label>
      <textarea id="embedDesc" placeholder="Embed body content..."></textarea>
    </div>

    <div class="flex-row">
      <div class="form-group" style="flex: 1;">
        <label for="fieldTitle">Field Title</label>
        <input type="text" id="fieldTitle" placeholder="Key Feature" />
      </div>
      <div class="form-group" style="flex: 1;">
        <label for="fieldValue">Field Value</label>
        <input type="text" id="fieldValue" placeholder="Awesome Detail" />
      </div>
    </div>

    <div class="flex-row">
      <div class="form-group" style="flex: 1;">
        <label for="embedImageUrl">Embed Main Image URL</label>
        <input type="url" id="embedImageUrl" placeholder="https://example.com/main-banner.png" />
      </div>
      <div class="form-group" style="flex: 1;">
        <label for="embedThumbnailUrl">Embed Thumbnail URL</label>
        <input type="url" id="embedThumbnailUrl" placeholder="https://example.com/small-icon.png" />
      </div>
    </div>

    <div class="form-group">
      <label for="embedFooter">Footer Text</label>
      <input type="text" id="embedFooter" placeholder="Sent via Yapin Webhook Web" />
    </div>
  </div>

  <button onclick="sendWebhook()">Send Message</button>
  <div id="status"></div>
</div>

<script>
  let activeSlot = 1;
  const DEFAULT_SLOTS_COUNT = 3;

  // Initialize slots on page load
  window.addEventListener('DOMContentLoaded', () => {
    renderSlots();
    loadSlotData(activeSlot);
  });

  function getStoredSlots() {
    const stored = localStorage.getItem('yapin_webhook_slots');
    if (stored) {
      try { return JSON.parse(stored); } catch(e) {}
    }
    // Default initial slots
    let initial = {};
    for (let i = 1; i <= DEFAULT_SLOTS_COUNT; i++) {
      initial[i] = { name: `Slot ${i}`, data: {} };
    }
    return initial;
  }

  function renderSlots() {
    const slotsGrid = document.getElementById('slotsGrid');
    slotsGrid.innerHTML = '';
    const slots = getStoredSlots();

    Object.keys(slots).forEach(slotId => {
      const btn = document.createElement('button');
      btn.className = `slot-btn ${parseInt(slotId) === activeSlot ? 'active' : ''}`;
      btn.innerText = slots[slotId].name || `Slot ${slotId}`;
      btn.onclick = () => switchSlot(parseInt(slotId));
      slotsGrid.appendChild(btn);
    });

    // Add '+' button to create extra slots
    const addBtn = document.createElement('button');
    addBtn.className = 'slot-add-btn';
    addBtn.innerText = '+';
    addBtn.title = 'Add new save slot';
    addBtn.onclick = addNewSlot;
    slotsGrid.appendChild(addBtn);
  }

  function switchSlot(slotId) {
    activeSlot = slotId;
    renderSlots();
    loadSlotData(activeSlot);
  }

  function addNewSlot() {
    const slots = getStoredSlots();
    const newId = Math.max(...Object.keys(slots).map(Number)) + 1;
    slots[newId] = { name: `Slot ${newId}`, data: {} };
    localStorage.setItem('yapin_webhook_slots', JSON.stringify(slots));
    switchSlot(newId);
  }

  function saveCurrentSlot() {
    const slots = getStoredSlots();
    const currentData = {
      webhookUrl: document.getElementById('webhookUrl').value,
      username: document.getElementById('username').value,
      avatarUrl: document.getElementById('avatarUrl').value,
      content: document.getElementById('content').value,
      messageImageUrl: document.getElementById('messageImageUrl').value,
      embedTitle: document.getElementById('embedTitle').value,
      embedColor: document.getElementById('embedColor').value,
      embedDesc: document.getElementById('embedDesc').value,
      fieldTitle: document.getElementById('fieldTitle').value,
      fieldValue: document.getElementById('fieldValue').value,
      embedImageUrl: document.getElementById('embedImageUrl').value,
      embedThumbnailUrl: document.getElementById('embedThumbnailUrl').value,
      embedFooter: document.getElementById('embedFooter').value,
    };

    // Auto-name slot using bot username or url fallback
    let slotName = currentData.username ? `Bot: ${currentData.username}` : `Slot ${activeSlot}`;
    slots[activeSlot] = { name: slotName, data: currentData };

    localStorage.setItem('yapin_webhook_slots', JSON.stringify(slots));
    renderSlots();
    showStatus(`Successfully saved configuration to Slot ${activeSlot}!`, true);
  }

  function loadSlotData(slotId) {
    const slots = getStoredSlots();
    const slot = slots[slotId];
    const data = slot ? slot.data : {};

    document.getElementById('webhookUrl').value = data.webhookUrl || '';
    document.getElementById('username').value = data.username || '';
    document.getElementById('avatarUrl').value = data.avatarUrl || '';
    document.getElementById('content').value = data.content || '';
    document.getElementById('messageImageUrl').value = data.messageImageUrl || '';
    document.getElementById('embedTitle').value = data.embedTitle || '';
    document.getElementById('embedColor').value = data.embedColor || '#6366f1';
    document.getElementById('embedDesc').value = data.embedDesc || '';
    document.getElementById('fieldTitle').value = data.fieldTitle || '';
    document.getElementById('fieldValue').value = data.fieldValue || '';
    document.getElementById('embedImageUrl').value = data.embedImageUrl || '';
    document.getElementById('embedThumbnailUrl').value = data.embedThumbnailUrl || '';
    document.getElementById('embedFooter').value = data.embedFooter || '';
  }

  function clearCurrentSlot() {
    const slots = getStoredSlots();
    slots[activeSlot] = { name: `Slot ${activeSlot}`, data: {} };
    localStorage.setItem('yapin_webhook_slots', JSON.stringify(slots));
    loadSlotData(activeSlot);
    renderSlots();
    showStatus(`Cleared Slot ${activeSlot}.`, true);
  }

  async function sendWebhook() {
    const webhookUrl = document.getElementById('webhookUrl').value.trim();
    if (!webhookUrl) {
      showStatus("Please enter a valid Webhook URL.", false);
      return;
    }

    const hexColor = document.getElementById('embedColor').value.replace('#', '');
    const colorInt = parseInt(hexColor, 16);

    const payload = {};
    const username = document.getElementById('username').value.trim();
    const avatarUrl = document.getElementById('avatarUrl').value.trim();
    const content = document.getElementById('content').value.trim();
    const messageImageUrl = document.getElementById('messageImageUrl').value.trim();

    if (username) payload.username = username;
    if (avatarUrl) payload.avatar_url = avatarUrl;
    
    let finalContent = content;
    if (messageImageUrl) {
      finalContent = finalContent ? `${finalContent}\n${messageImageUrl}` : messageImageUrl;
    }
    if (finalContent) payload.content = finalContent;

    const embedTitle = document.getElementById('embedTitle').value.trim();
    const embedDesc = document.getElementById('embedDesc').value.trim();
    const fieldTitle = document.getElementById('fieldTitle').value.trim();
    const fieldValue = document.getElementById('fieldValue').value.trim();
    const embedFooter = document.getElementById('embedFooter').value.trim();
    const embedImageUrl = document.getElementById('embedImageUrl').value.trim();
    const embedThumbnailUrl = document.getElementById('embedThumbnailUrl').value.trim();

    if (embedTitle || embedDesc || fieldTitle || embedFooter || embedImageUrl || embedThumbnailUrl) {
      const embed = { color: colorInt };

      if (embedTitle) embed.title = embedTitle;
      if (embedDesc) embed.description = embedDesc;
      if (embedFooter) embed.footer = { text: embedFooter };
      if (embedImageUrl) embed.image = { url: embedImageUrl };
      if (embedThumbnailUrl) embed.thumbnail = { url: embedThumbnailUrl };

      if (fieldTitle && fieldValue) {
        embed.fields = [{ name: fieldTitle, value: fieldValue, inline: true }];
      }

      payload.embeds = [embed];
    }

    const fileInput = document.getElementById('fileInput');
    const hasFile = fileInput.files.length > 0;

    if (!payload.content && !payload.embeds && !hasFile) {
      showStatus("Please provide message content, fill in the embed, or attach a file.", false);
      return;
    }

    try {
      let requestOptions = {};
      if (hasFile) {
        const formData = new FormData();
        formData.append('payload_json', JSON.stringify(payload));
        formData.append('file', fileInput.files[0]);
        requestOptions = { method: 'POST', body: formData };
      } else {
        requestOptions = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        };
      }

      const response = await fetch(webhookUrl, requestOptions);

      if (response.ok || response.status === 204) {
        showStatus("Message sent successfully!", true);
      } else {
        const errorText = await response.text();
        showStatus(`Error (${response.status}): ${errorText || 'Failed to send'}`, false);
      }
    } catch (err) {
      showStatus(`Network Error: ${err.message}`, false);
    }
  }

  function showStatus(message, isSuccess) {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = 'block';
    statusDiv.innerText = message;
    statusDiv.className = isSuccess ? 'status-success' : 'status-error';
  }
</script>

</body>
</html>
